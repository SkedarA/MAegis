services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: maegis
      POSTGRES_USER: maegis
      POSTGRES_PASSWORD: maegis
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maegis"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["5432:5432"]

  api:
    build: ./services/api
    environment:
      MAEGIS_DATABASE_URL: postgresql+psycopg://maegis:maegis@postgres:5432/maegis
      MAEGIS_API_KEY: ${MAEGIS_API_KEY:-development-only}
      MAEGIS_CAPTURE_ENABLED: ${MAEGIS_CAPTURE_ENABLED:-false}
      MAEGIS_URLHAUS_AUTH_KEY: ${MAEGIS_URLHAUS_AUTH_KEY:-}
      MAEGIS_CZDS_DIRECTORY: /data/czds
      MAEGIS_DISCOVERY_BRAND_BATCH_SIZE: ${MAEGIS_DISCOVERY_BRAND_BATCH_SIZE:-5}
      MAEGIS_DISCOVERY_DNS_BATCH_SIZE: ${MAEGIS_DISCOVERY_DNS_BATCH_SIZE:-40}
      MAEGIS_DISCOVERY_RDAP_BATCH_SIZE: ${MAEGIS_DISCOVERY_RDAP_BATCH_SIZE:-10}
      MAEGIS_DISCOVERY_POLL_INTERVAL_SECONDS: ${MAEGIS_DISCOVERY_POLL_INTERVAL_SECONDS:-900}
    volumes:
      - ./data/czds:/data/czds:ro
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8000:8000"]

  discovery-worker:
    build: ./services/api
    command: ["python", "-m", "app.worker"]
    environment:
      MAEGIS_DATABASE_URL: postgresql+psycopg://maegis:maegis@postgres:5432/maegis
      MAEGIS_URLHAUS_AUTH_KEY: ${MAEGIS_URLHAUS_AUTH_KEY:-}
      MAEGIS_CZDS_DIRECTORY: /data/czds
      MAEGIS_DISCOVERY_BRAND_BATCH_SIZE: ${MAEGIS_DISCOVERY_BRAND_BATCH_SIZE:-5}
      MAEGIS_DISCOVERY_DNS_BATCH_SIZE: ${MAEGIS_DISCOVERY_DNS_BATCH_SIZE:-40}
      MAEGIS_DISCOVERY_RDAP_BATCH_SIZE: ${MAEGIS_DISCOVERY_RDAP_BATCH_SIZE:-10}
      MAEGIS_DISCOVERY_POLL_INTERVAL_SECONDS: ${MAEGIS_DISCOVERY_POLL_INTERVAL_SECONDS:-900}
      MAEGIS_WORKER_HEALTH_STALE_SECONDS: ${MAEGIS_WORKER_HEALTH_STALE_SECONDS:-2400}
    volumes:
      - ./data/czds:/data/czds:ro
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10m

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on: [api]
    environment:
      MAEGIS_API_URL: http://api:8000
      MAEGIS_API_KEY: ${MAEGIS_API_KEY:-development-only}
      MAEGIS_USER_ID: ${MAEGIS_USER_ID:-local-analyst}
      MAEGIS_USER_EMAIL: ${MAEGIS_USER_EMAIL:-analyst@maegis.local}
      MAEGIS_USER_NAME: ${MAEGIS_USER_NAME:-Local Analyst}
      MAEGIS_USER_ROLE: ${MAEGIS_USER_ROLE:-administrator}
    ports: ["3000:3000"]

  safe-capture:
    profiles: ["capture"]
    build: ./services/capture
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=256m,noexec,nosuid"]
    volumes:
      - capture-artifacts:/artifacts
    pids_limit: 128
    mem_limit: 768m
    command: ["https://example.com", "--output", "/artifacts/example"]

volumes:
  postgres-data:
  capture-artifacts:
