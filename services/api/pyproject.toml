[project]
name = "aegismark-api"
version = "0.1.0"
description = "Operational brand-abuse discovery and triage API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "dnspython>=2.7,<3",
  "idna>=3.10,<4",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

